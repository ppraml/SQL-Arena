<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>SQL-Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FB; --paper:#FFFFFF; --ink:#16213A; --ink2:#4B5877; --line:#D3DBEA; --grid:rgba(40,70,130,.055);
  --s:#2559D6; --s-bg:#E3EBFC;
  --b:#96600F; --b-bg:#FBEFD5;
  --a:#137A54; --a-bg:#DCF2E8;
  --k:#6D3FCB; --k-bg:#EAE3FA;
  --warn:#BF3227; --warn-bg:#FCE5E2;
  --mk:#FFE566; --hl-bg:#FFF1A8; --hl:#D9B300;
  --code-bg:#101A33; --code-ink:#E6EDFF;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --hh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1322; --paper:#151D33; --ink:#E8EDF9; --ink2:#A3B0CC; --line:#2B3654; --grid:rgba(140,170,255,.05);
    --s:#8CAEFF; --s-bg:#1A2A55;
    --b:#F0BA55; --b-bg:#3A2D12;
    --a:#5ED6A5; --a-bg:#123829;
    --k:#BBA0FF; --k-bg:#2B2252;
    --warn:#FF9086; --warn-bg:#45201D;
    --mk:#6B5A0F; --hl-bg:#4D4110; --hl:#FFD84A;
    --code-bg:#0A0F1D;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1322; --paper:#151D33; --ink:#E8EDF9; --ink2:#A3B0CC; --line:#2B3654; --grid:rgba(140,170,255,.05);
  --s:#8CAEFF; --s-bg:#1A2A55;
  --b:#F0BA55; --b-bg:#3A2D12;
  --a:#5ED6A5; --a-bg:#123829;
  --k:#BBA0FF; --k-bg:#2B2252;
  --warn:#FF9086; --warn-bg:#45201D;
  --mk:#6B5A0F; --hl-bg:#4D4110; --hl:#FFD84A;
  --code-bg:#0A0F1D;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; padding-inline:16px; padding-block:0 60px;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:400 16px/1.6 var(--f-body);
}
main{max-width:900px; margin-inline:auto}
p{margin:0 0 12px; max-width:70ch}
b,strong{font-weight:700}
code{font-family:var(--f-mono); font-size:.85em; background:var(--code-bg); color:var(--code-ink); border-radius:5px; padding:1px 6px; word-break:break-word}
:focus-visible{outline:3px solid var(--s); outline-offset:2px}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display); letter-spacing:-.02em; margin:0 0 8px}
mark{background:linear-gradient(transparent 56%,var(--mk) 56% 94%,transparent 94%); color:inherit; padding:0 .06em}
.eyebrow{font:600 12px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); margin-bottom:4px}

/* ---- Buttons ---- */
.btn{appearance:none; cursor:pointer; border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  font:700 14.5px var(--f-body); padding:10px 16px; border-radius:12px; transition:transform .1s, box-shadow .15s, border-color .15s}
.btn:hover{border-color:var(--ink2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--s); border-color:var(--s); color:#fff}
.btn.primary:hover{box-shadow:0 4px 14px color-mix(in srgb, var(--s) 45%, transparent)}
.btn.big{padding:14px 22px; font-size:16px; border-radius:14px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---- HUD ---- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; margin-inline:-16px;
  background:color-mix(in srgb,var(--bg) 93%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.hud{display:flex; align-items:center; gap:10px 16px; padding:10px 16px; max-width:932px; margin-inline:auto; flex-wrap:wrap}
.hbrand{appearance:none; border:0; background:none; cursor:pointer; padding:0; display:flex; align-items:center; gap:6px; color:var(--ink); font:800 17px var(--f-display)}
.hbrand b{color:var(--s)}
.hstat{display:flex; align-items:center; gap:8px; font:700 13px var(--f-mono); color:var(--ink2)}
.hstat.hcoin{margin-left:auto; background:var(--b-bg); color:var(--b); padding:4px 10px; border-radius:99px}
.hlv{white-space:nowrap}
.hxpbar{width:70px; height:7px; border-radius:99px; background:var(--line); overflow:hidden; display:inline-block}
.hxpbar i{display:block; height:100%; background:var(--a); transition:width .4s}
@media (max-width:420px){ .hbrand{font-size:15px} .hxpbar{width:46px} }
/* ============================================================
   Game UI
   ============================================================ */
.mapwrap{padding-block:12px 32px}
.hero{padding:22px 4px 8px}
.hero h1{font:800 clamp(30px,7vw,48px)/1.05 var(--f-display); letter-spacing:-.03em; margin:0 0 10px}
.herotxt{color:var(--ink2); max-width:60ch}
.herostats{display:flex; gap:22px; margin-top:14px; flex-wrap:wrap}
.herostats div{display:flex; flex-direction:column}
.herostats b{font:800 24px var(--f-display)}
.herostats span{font:600 11px var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--ink2)}

.path{display:flex; flex-direction:column; gap:22px; margin-top:18px}
.worldsec{border:1.5px solid var(--line); background:var(--paper); border-radius:18px; padding:16px 16px 18px; position:relative; overflow:hidden}
.worldsec::before{content:''; position:absolute; inset:0 0 auto 0; height:5px; background:var(--_c,var(--s))}
.worldsec.g-s::before{background:var(--s)} .worldsec.g-k::before{background:var(--k)} .worldsec.g-a::before{background:var(--a)}
.worldsec.g-b::before{background:var(--b)} .worldsec.g-warn::before{background:var(--warn)}
.wsechead{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.wicon{font-size:28px; line-height:1}
.wicon.big{font-size:44px}
.wsechead h2{font:800 18px var(--f-display); margin:0}
.wsechead p{margin:2px 0 0; color:var(--ink2); font-size:13px}
.wstars{margin-left:auto}
.stars{display:inline-flex; gap:1px}
.star{color:var(--line); font-size:15px}
.star.on{color:var(--hl)}

.stagerow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.finalesec .stagerow{grid-template-columns:1fr}
.node{appearance:none; cursor:pointer; border:1.5px solid var(--line); background:var(--bg); border-radius:14px; padding:14px 10px;
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; min-height:108px; transition:transform .12s, border-color .15s}
.node:hover:not(:disabled){border-color:var(--ink2); transform:translateY(-2px)}
.node:disabled{opacity:.55; cursor:not-allowed}
.node.done{background:var(--a-bg); border-color:var(--a)}
.node.ready{border-color:var(--s); box-shadow:0 0 0 2px color-mix(in srgb,var(--s) 25%, transparent)}
.nicon{font-size:24px}
.nlabel{font:700 13px var(--f-body)}
.nhint{font:500 11px var(--f-body); color:var(--ink2)}
.examnode{min-height:80px; flex-direction:row; justify-content:flex-start; gap:14px; text-align:left; padding:16px 18px}
.examnode .nlabel{font-size:15px}

/* ---- Intro-Screen ---- */
.introwrap{padding-block:16px 40px; max-width:560px; margin-inline:auto}
.backlnk{appearance:none; border:0; background:none; cursor:pointer; color:var(--ink2); font:700 13px var(--f-body); padding:6px 0; margin-bottom:10px}
.introcard{border:1.5px solid var(--line); background:var(--paper); border-radius:20px; padding:32px 24px; text-align:center}
.introcard h2{font-size:26px; margin:6px 0 10px}
.introcard p{margin-inline:auto; color:var(--ink2)}
.examchoices{display:flex; flex-direction:column; gap:10px; margin-top:18px}

/* ---- Stage-Runner ---- */
.stagewrap{padding-block:14px 40px; max-width:640px; margin-inline:auto; position:relative}
.stagehead{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.stagehead .backlnk{margin:0; font-size:18px}
.qprog{flex:1; height:7px; border-radius:99px; background:var(--line); overflow:hidden}
.qprog i{display:block; height:100%; background:var(--s); transition:width .3s}
.lives, .mtime, .examn{font:700 13px var(--f-mono); white-space:nowrap; color:var(--ink2)}
.streakbadge{display:inline-block; background:var(--warn-bg); color:var(--warn); font:800 12px var(--f-mono); padding:4px 10px; border-radius:99px; margin-bottom:8px}
.streakbadge.hot{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.timerbar{height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:14px}
.timerbar i{display:block; height:100%; background:var(--warn); transition:width .1s linear}
.qtext{font:700 clamp(19px,4vw,24px)/1.3 var(--f-display); margin:0 0 16px}
.qcount{color:var(--ink2); font:600 12px var(--f-mono); margin-top:10px}
.opts{display:grid; gap:10px}
.opt{appearance:none; cursor:pointer; text-align:left; border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  font:600 15px var(--f-body); padding:13px 16px; border-radius:12px; transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--s)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--a-bg); border-color:var(--a); color:var(--a)}
.opt.wrong{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.expl{margin-top:14px; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font-size:14px; line-height:1.5}
.expl.ok{border-color:var(--a); background:var(--a-bg)}
.expl.no{border-color:var(--warn); background:var(--warn-bg)}
.expl code{display:inline-block; margin-top:4px}
.nextrow{margin-top:12px}
.nextrow .btn{width:100%}

/* ---- Ergebnis-Karte ---- */
.resultcard{border:1.5px solid var(--line); background:var(--paper); border-radius:20px; padding:36px 24px; text-align:center; position:relative; overflow:hidden; margin-top:10px}
.resultcard.win{border-color:var(--a)}
.resultcard.lose{border-color:var(--warn)}
.ricon{font-size:44px; display:block; margin-bottom:8px}
.resultcard h2{font-size:24px}
.resultcard .stars{justify-content:center; margin:10px 0}
.resultcard .stars .star{font-size:26px}
.rewards{font:800 15px var(--f-mono); color:var(--b)}
.rbtns{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap}
.confwrap{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.confetti{position:absolute; top:40%; left:50%; width:8px; height:8px; border-radius:2px;
  transform:translate(calc(var(--x,0)*140px), 0) rotate(var(--r,0deg));
  animation:confetti var(--d,0.9s) ease-out forwards}
@keyframes confetti{ from{ opacity:1; transform:translate(calc(var(--x,0)*20px), -10px) rotate(0deg);} to{ opacity:0; transform:translate(calc(var(--x,0)*160px), 220px) rotate(var(--r,180deg));} }

/* ---- Match ---- */
.matchgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-top:10px}
.mitem{appearance:none; cursor:pointer; text-align:left; border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  font:600 13.5px/1.35 var(--f-body); padding:11px 12px; border-radius:11px; min-height:52px; display:flex; align-items:center}
.mitem:hover:not(:disabled){border-color:var(--s)}
.mitem.sel{border-color:var(--s); background:var(--s-bg); box-shadow:0 0 0 2px var(--s)}
.mitem.done{background:var(--a-bg); border-color:var(--a); color:var(--a); opacity:.8}
.mitem.shake{animation:shake .4s}
@keyframes shake{ 10%,90%{transform:translateX(-3px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)} }

/* ---- SQL-Werkstatt ---- */
.attemptct{font:700 13px var(--f-mono); color:var(--ink2); white-space:nowrap}
.sqlintro{background:var(--hl-bg); color:var(--b); border-radius:12px; padding:10px 14px; font-size:13.5px; font-weight:600; margin:0 0 10px}
.sqltask{background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; font-size:15.5px; line-height:1.5}
.refrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.refrow .schemabox{flex:1 1 220px; margin-bottom:0}
.schemabox{border:1.5px dashed var(--line); border-radius:12px; padding:8px 12px}
.schemabox summary{cursor:pointer; font:700 13px var(--f-body); color:var(--ink2); padding:4px 0}
.schemas{display:flex; gap:14px; overflow-x:auto; padding:8px 2px}
.schemat{flex:0 0 auto; min-width:180px}
.schemat h5{margin:0 0 4px; font:700 12px var(--f-mono); color:var(--ink2)}
.schemat h5 span{font-weight:400}
.cheats{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; padding:8px 2px}
.cheatcard{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px}
.cheatcard h6{margin:0 0 4px; font:700 11.5px var(--f-body); color:var(--ink2)}
.cheatcard pre{margin:0; font:12px/1.5 var(--f-mono); color:var(--ink); white-space:pre-wrap; word-break:break-word}
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th,td{padding:5px 9px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
th{background:var(--bg); font:700 11px var(--f-mono); text-transform:uppercase; letter-spacing:.03em; color:var(--ink2)}
td i{color:var(--ink2); font-style:italic}
.restbl{font-size:13.5px}
.sqlin{width:100%; min-height:92px; font:14px/1.5 var(--f-mono); background:var(--code-bg); color:var(--code-ink);
  border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; resize:vertical}
.sqlin:focus{outline:2px solid var(--s); outline-offset:1px}
.sqlbtns{display:flex; gap:8px; margin:10px 0; flex-wrap:wrap}
.hintbtn:disabled{opacity:.4}
.solbtn{border-color:var(--k); color:var(--k)}
.sqlout{margin-bottom:6px}
.sqlmsg{font:600 13.5px var(--f-body); padding:8px 0}
.sqlmsg.err{color:var(--warn)}
.sqlmsg.ok{color:var(--a)}
.sqlmsg.warn{color:var(--b)}
.rowcount{color:var(--ink2); font:600 11px var(--f-mono); margin:4px 0 0}
.hintout{margin-top:6px}
.hintline{background:var(--b-bg); color:var(--b); border-radius:10px; padding:9px 12px; font-size:13.5px; margin:0 0 6px}
.hintline.solreveal{background:var(--k-bg); color:var(--k)}
.hintline.nudge{background:var(--s-bg); color:var(--s)}

/* ---- Exam / Prüfungsarena ---- */
.worldbars{display:grid; gap:10px; margin:16px 0; text-align:left}
.wbar{display:grid; grid-template-columns:150px 1fr 40px; align-items:center; gap:8px 10px; font-size:12.5px}
.wblabel{color:var(--ink2); line-height:1.25}
.wbtrack{height:8px; border-radius:99px; background:var(--line); overflow:hidden}
.wbtrack i{display:block; height:100%; background:var(--a)}
.wbtrack i.low{background:var(--warn)}
.wbpct{font:700 12px var(--f-mono); text-align:right}
.weaktip{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 14px; font-weight:700; font-size:13.5px}
.weaktip.ok{background:var(--a-bg); color:var(--a)}
@media (max-width:480px){ .wbar{grid-template-columns:1fr 40px} .wblabel{grid-column:1/-1}}

/* ---- Toast ---- */
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper);
  font:700 13.5px var(--f-body); padding:10px 18px; border-radius:99px; opacity:0; transition:opacity .25s, transform .25s; z-index:80; white-space:nowrap}
.toast.ok{background:var(--a)}
.toast.no{background:var(--warn)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:520px){
  .stagerow{grid-template-columns:repeat(3,1fr); gap:7px}
  .node{min-height:96px; padding:10px 6px}
  .matchgrid{gap:7px 8px}
}
</style>
<div class="top">
  <div id="hud" class="hud"></div>
</div>

<script>
/* ============================================================
   Mini-SQL-Engine — Tokenizer, Parser, Evaluator
   Unterstützt: SELECT (DISTINCT, *, Ausdrücke, Aggregatfunktionen,
   JOIN/INNER JOIN/LEFT JOIN, WHERE, GROUP BY, HAVING, ORDER BY, LIMIT),
   INSERT INTO ... VALUES, UPDATE ... SET ... WHERE, DELETE FROM ... WHERE.
   Arbeitet auf einer einfachen In-Memory-DB: {TABLE:[{col:val,...},...]}
   ============================================================ */
(function(root){
'use strict';

/* ---------- Tokenizer ---------- */
const KEYWORDS = new Set(['SELECT','FROM','WHERE','AND','OR','NOT','AS','JOIN','INNER','LEFT','RIGHT','OUTER',
  'ON','GROUP','BY','HAVING','ORDER','ASC','DESC','LIMIT','DISTINCT','IN','IS','NULL','LIKE','BETWEEN',
  'INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','PRIMARY','KEY','FOREIGN','REFERENCES',
  'NOT','DEFAULT','UNIQUE','TRUE','FALSE','UNION','ALL','EXISTS']);

function tokenize(sql){
  const toks = []; let i = 0; const n = sql.length;
  const isDigit = c => c >= '0' && c <= '9';
  const isAlpha = c => /[A-Za-zÄÖÜäöüß_]/.test(c);
  const isAlnum = c => /[A-Za-z0-9ÄÖÜäöüß_]/.test(c);
  while(i < n){
    const c = sql[i];
    if(/\s/.test(c)){ i++; continue; }
    if(c === '-' && sql[i+1] === '-'){ while(i<n && sql[i] !== '\n') i++; continue; }
    if(c === "'"){
      let j = i+1, s = '';
      while(j < n){
        if(sql[j] === "'" && sql[j+1] === "'"){ s += "'"; j += 2; continue; }
        if(sql[j] === "'") break;
        s += sql[j]; j++;
      }
      toks.push({t:'str', v:s}); i = j+1; continue;
    }
    if(c === '"'){
      let j = i+1, s = '';
      while(j < n && sql[j] !== '"'){ s += sql[j]; j++; }
      toks.push({t:'ident', v:s}); i = j+1; continue;
    }
    if(isDigit(c) || (c === '.' && isDigit(sql[i+1]))){
      let j = i, s = '';
      while(j < n && (isDigit(sql[j]) || sql[j] === '.')){ s += sql[j]; j++; }
      toks.push({t:'num', v:parseFloat(s)}); i = j; continue;
    }
    if(isAlpha(c)){
      let j = i, s = '';
      while(j < n && isAlnum(sql[j])){ s += sql[j]; j++; }
      const up = s.toUpperCase();
      if(KEYWORDS.has(up)) toks.push({t:'kw', v:up});
      else toks.push({t:'ident', v:s});
      i = j; continue;
    }
    if(c === '<' && sql[i+1] === '='){ toks.push({t:'op', v:'<='}); i+=2; continue; }
    if(c === '>' && sql[i+1] === '='){ toks.push({t:'op', v:'>='}); i+=2; continue; }
    if(c === '<' && sql[i+1] === '>'){ toks.push({t:'op', v:'!='}); i+=2; continue; }
    if(c === '!' && sql[i+1] === '='){ toks.push({t:'op', v:'!='}); i+=2; continue; }
    if('=<>+-*/,.()'.includes(c)){ toks.push({t: (c===','||c==='('||c===')'||c==='.') ? 'punc' : 'op', v:c}); i++; continue; }
    if(c === ';'){ i++; continue; }
    throw new SqlError("Unerwartetes Zeichen: '"+c+"'");
  }
  toks.push({t:'eof', v:null});
  return toks;
}

class SqlError extends Error {}

/* ---------- Parser ---------- */
class Parser {
  constructor(toks){ this.toks = toks; this.p = 0; }
  peek(){ return this.toks[this.p]; }
  next(){ return this.toks[this.p++]; }
  isKw(v){ const t = this.peek(); return t.t === 'kw' && t.v === v; }
  isOp(v){ const t = this.peek(); return (t.t === 'op' || t.t === 'punc') && t.v === v; }
  eatKw(v){ if(!this.isKw(v)) throw new SqlError('Erwartet: '+v+', gefunden: '+this._show()); return this.next(); }
  eatOp(v){ if(!this.isOp(v)) throw new SqlError('Erwartet: "'+v+'", gefunden: '+this._show()); return this.next(); }
  _show(){ const t = this.peek(); return t.t==='eof' ? 'Ende' : JSON.stringify(t.v); }

  parseStatement(){
    if(this.isKw('SELECT')) return this.parseSelect();
    if(this.isKw('INSERT')) return this.parseInsert();
    if(this.isKw('UPDATE')) return this.parseUpdate();
    if(this.isKw('DELETE')) return this.parseDelete();
    if(this.isKw('CREATE')) return this.parseCreate();
    throw new SqlError('Unbekannte Anweisung (erwarte SELECT/INSERT/UPDATE/DELETE/CREATE): '+this._show());
  }

  parseIdentPath(){
    // ident[.ident] oder *
    if(this.isOp('*')){ this.next(); return {type:'star'}; }
    const first = this.next();
    if(first.t !== 'ident' && first.t !== 'kw') throw new SqlError('Bezeichner erwartet, gefunden: '+JSON.stringify(first.v));
    let name = first.v;
    if(this.isOp('.')){
      this.next();
      if(this.isOp('*')){ this.next(); return {type:'star', table:name}; }
      const second = this.next();
      return {type:'col', table:name, col:second.v};
    }
    return {type:'col', table:null, col:name};
  }

  parseSelect(){
    this.eatKw('SELECT');
    let distinct = false;
    if(this.isKw('DISTINCT')){ this.next(); distinct = true; }
    const cols = [];
    do{
      if(this.isOp(',')) this.next();
      cols.push(this.parseSelectItem());
    } while(this.isOp(','));
    this.eatKw('FROM');
    const from = this.parseTableRef();
    const joins = [];
    while(this.isKw('JOIN') || this.isKw('INNER') || this.isKw('LEFT') || this.isKw('RIGHT')){
      let jt = 'INNER';
      if(this.isKw('LEFT')){ jt='LEFT'; this.next(); if(this.isKw('OUTER')) this.next(); }
      else if(this.isKw('RIGHT')){ jt='RIGHT'; this.next(); if(this.isKw('OUTER')) this.next(); }
      else if(this.isKw('INNER')){ jt='INNER'; this.next(); }
      this.eatKw('JOIN');
      const tbl = this.parseTableRef();
      this.eatKw('ON');
      const on = this.parseExprOr();
      joins.push({type:jt, table:tbl, on});
    }
    let where = null;
    if(this.isKw('WHERE')){ this.next(); where = this.parseExprOr(); }
    let groupBy = null;
    if(this.isKw('GROUP')){ this.next(); this.eatKw('BY'); groupBy = []; do{ if(this.isOp(',')) this.next(); groupBy.push(this.parseIdentPath()); } while(this.isOp(',')); }
    let having = null;
    if(this.isKw('HAVING')){ this.next(); having = this.parseExprOr(); }
    let orderBy = null;
    if(this.isKw('ORDER')){ this.next(); this.eatKw('BY'); orderBy = []; do{
        if(this.isOp(',')) this.next();
        const e = this.parseAddSub();
        let dir = 'ASC';
        if(this.isKw('ASC')){ this.next(); } else if(this.isKw('DESC')){ this.next(); dir='DESC'; }
        orderBy.push({expr:e, dir});
      } while(this.isOp(','));
    }
    let limit = null;
    if(this.isKw('LIMIT')){ this.next(); const t = this.next(); limit = t.v; }
    return {type:'select', distinct, cols, from, joins, where, groupBy, having, orderBy, limit};
  }

  parseSelectItem(){
    const e = this.parseAddSub();
    let alias = null;
    if(this.isKw('AS')){ this.next(); alias = this.next().v; }
    else if(this.peek().t === 'ident'){ alias = this.next().v; }
    return {expr:e, alias};
  }

  parseTableRef(){
    const nameTok = this.next();
    const name = nameTok.v;
    let alias = null;
    if(this.isKw('AS')){ this.next(); alias = this.next().v; }
    else if(this.peek().t === 'ident'){ alias = this.next().v; }
    return {name, alias};
  }

  // Ausdrücke (Booleans mit OR/AND/NOT, Vergleich, +-*/, Funktionen)
  parseExprOr(){
    let left = this.parseExprAnd();
    while(this.isKw('OR')){ this.next(); const right = this.parseExprAnd(); left = {op:'OR', l:left, r:right}; }
    return left;
  }
  parseExprAnd(){
    let left = this.parseExprNot();
    while(this.isKw('AND')){ this.next(); const right = this.parseExprNot(); left = {op:'AND', l:left, r:right}; }
    return left;
  }
  parseExprNot(){
    if(this.isKw('NOT')){ this.next(); return {op:'NOT', e:this.parseExprNot()}; }
    return this.parsePredicate();
  }
  parsePredicate(){
    if(this.isOp('(')){
      // Könnte geklammerter Bool-Ausdruck sein
      const save = this.p;
      this.next();
      try{
        const inner = this.parseExprOr();
        if(this.isOp(')')){ this.next(); return this.maybeChainAfterParen(inner); }
      }catch(e){}
      this.p = save;
    }
    const left = this.parseAddSub();
    if(this.isKw('IS')){
      this.next();
      let neg = false;
      if(this.isKw('NOT')){ this.next(); neg = true; }
      this.eatKw('NULL');
      return {op: neg?'ISNOTNULL':'ISNULL', e:left};
    }
    if(this.isKw('NOT')){
      this.next();
      if(this.isKw('LIKE')){ this.next(); const r = this.parseAddSub(); return {op:'NOT', e:{op:'LIKE', l:left, r}}; }
      if(this.isKw('IN')){ this.next(); const list = this.parseInList(); return {op:'NOT', e:{op:'IN', l:left, r:list}}; }
      if(this.isKw('BETWEEN')){ this.next(); const lo=this.parseAddSub(); this.eatKw('AND'); const hi=this.parseAddSub(); return {op:'NOT', e:{op:'BETWEEN', e:left, lo, hi}}; }
      throw new SqlError('NOT ... erwartet LIKE/IN/BETWEEN');
    }
    if(this.isKw('LIKE')){ this.next(); const r = this.parseAddSub(); return {op:'LIKE', l:left, r}; }
    if(this.isKw('IN')){ this.next(); const list = this.parseInList(); return {op:'IN', l:left, r:list}; }
    if(this.isKw('BETWEEN')){ this.next(); const lo=this.parseAddSub(); this.eatKw('AND'); const hi=this.parseAddSub(); return {op:'BETWEEN', e:left, lo, hi}; }
    const t = this.peek();
    if(t.t === 'op' && ['=','!=','<','>','<=','>='].includes(t.v)){
      this.next();
      const right = this.parseAddSub();
      return {op:'CMP', cmp:t.v, l:left, r:right};
    }
    return left; // roher Ausdruck (z.B. Spalte als boolescher Kontext, selten)
  }
  maybeChainAfterParen(inner){ return inner; }
  parseInList(){
    this.eatOp('(');
    const items = [];
    do{ if(this.isOp(',')) this.next(); items.push(this.parseAddSub()); } while(this.isOp(','));
    this.eatOp(')');
    return items;
  }

  parseAddSub(){
    let left = this.parseMulDiv();
    while(this.isOp('+') || this.isOp('-')){
      const op = this.next().v;
      const right = this.parseMulDiv();
      left = {op:'ARITH', a:op, l:left, r:right};
    }
    return left;
  }
  parseMulDiv(){
    let left = this.parseUnary();
    while(this.isOp('*') || this.isOp('/')){
      const op = this.next().v;
      const right = this.parseUnary();
      left = {op:'ARITH', a:op, l:left, r:right};
    }
    return left;
  }
  parseUnary(){
    if(this.isOp('-')){ this.next(); const e = this.parseUnary(); return {op:'NEG', e}; }
    return this.parsePrimary();
  }
  parsePrimary(){
    const t = this.peek();
    if(t.t === 'num'){ this.next(); return {op:'LIT', v:t.v}; }
    if(t.t === 'str'){ this.next(); return {op:'LIT', v:t.v}; }
    if(this.isKw('NULL')){ this.next(); return {op:'LIT', v:null}; }
    if(this.isKw('TRUE')){ this.next(); return {op:'LIT', v:true}; }
    if(this.isKw('FALSE')){ this.next(); return {op:'LIT', v:false}; }
    if(this.isOp('(')){
      this.next();
      const e = this.parseExprOr();
      this.eatOp(')');
      return e;
    }
    if(this.isOp('*')){ this.next(); return {op:'STAR'}; }
    // Funktion oder Spalte
    if(t.t === 'ident' || t.t === 'kw'){
      const nameTok = this.next();
      const name = nameTok.v;
      if(this.isOp('(')){
        this.next();
        let distinct = false;
        if(this.isKw('DISTINCT')){ this.next(); distinct = true; }
        const args = [];
        if(!this.isOp(')')){
          do{ if(this.isOp(',')) this.next(); args.push(this.isOp('*') ? (this.next(), {op:'STAR'}) : this.parseExprOr()); } while(this.isOp(','));
        }
        this.eatOp(')');
        return {op:'FUNC', name:name.toUpperCase(), args, distinct};
      }
      if(this.isOp('.')){
        this.next();
        const col = this.next();
        return {op:'COL', table:name, col: col.v};
      }
      return {op:'COL', table:null, col:name};
    }
    throw new SqlError('Unerwarteter Ausdruck: '+this._show());
  }

  parseInsert(){
    this.eatKw('INSERT'); this.eatKw('INTO');
    const table = this.next().v;
    let cols = null;
    if(this.isOp('(')){
      this.next(); cols = [];
      do{ if(this.isOp(',')) this.next(); cols.push(this.next().v); } while(this.isOp(','));
      this.eatOp(')');
    }
    this.eatKw('VALUES');
    const rows = [];
    do{
      if(this.isOp(',')) this.next();
      this.eatOp('(');
      const vals = [];
      do{ if(this.isOp(',')) this.next(); vals.push(this.parseAddSub()); } while(this.isOp(','));
      this.eatOp(')');
      rows.push(vals);
    } while(this.isOp(','));
    return {type:'insert', table, cols, rows};
  }

  parseUpdate(){
    this.eatKw('UPDATE');
    const table = this.next().v;
    this.eatKw('SET');
    const sets = [];
    do{
      if(this.isOp(',')) this.next();
      const col = this.next().v;
      this.eatOp('=');
      const val = this.parseAddSub();
      sets.push({col, val});
    } while(this.isOp(','));
    let where = null;
    if(this.isKw('WHERE')){ this.next(); where = this.parseExprOr(); }
    return {type:'update', table, sets, where};
  }

  parseDelete(){
    this.eatKw('DELETE'); this.eatKw('FROM');
    const table = this.next().v;
    let where = null;
    if(this.isKw('WHERE')){ this.next(); where = this.parseExprOr(); }
    return {type:'delete', table, where};
  }

  parseCreate(){
    this.eatKw('CREATE'); this.eatKw('TABLE');
    const table = this.next().v;
    this.eatOp('(');
    const cols = [];
    do{
      if(this.isOp(',')) this.next();
      if(this.isKw('PRIMARY')){ this.next(); this.eatKw('KEY'); this.eatOp('('); const pk=[]; do{ if(this.isOp(',')) this.next(); pk.push(this.next().v); }while(this.isOp(',')); this.eatOp(')'); cols.push({kind:'PK', cols:pk}); continue; }
      if(this.isKw('FOREIGN')){ this.next(); this.eatKw('KEY'); this.eatOp('('); const fk=[]; do{ if(this.isOp(',')) this.next(); fk.push(this.next().v); }while(this.isOp(',')); this.eatOp(')'); this.eatKw('REFERENCES'); const rt=this.next().v; let rc=null; if(this.isOp('(')){ this.next(); rc=this.next().v; this.eatOp(')'); } cols.push({kind:'FK', cols:fk, refTable:rt, refCol:rc}); continue; }
      const cname = this.next().v;
      let ctype = this.next().v; // e.g. INT, VARCHAR
      if(this.isOp('(')){ this.next(); while(!this.isOp(')')) this.next(); this.next(); }
      const flags = [];
      while(true){
        if(this.isKw('PRIMARY')){ this.next(); this.eatKw('KEY'); flags.push('PK'); continue; }
        if(this.isKw('NOT')){ this.next(); this.eatKw('NULL'); flags.push('NOTNULL'); continue; }
        if(this.isKw('NULL')){ this.next(); continue; }
        if(this.isKw('UNIQUE')){ this.next(); flags.push('UNIQUE'); continue; }
        if(this.isKw('DEFAULT')){ this.next(); this.parseAddSub(); flags.push('DEFAULT'); continue; }
        if(this.isKw('REFERENCES')){ this.next(); const rt=this.next().v; let rc=null; if(this.isOp('(')){ this.next(); rc=this.next().v; this.eatOp(')'); } flags.push('FK:'+rt+(rc?'.'+rc:'')); continue; }
        break;
      }
      cols.push({kind:'COL', name:cname, dtype:String(ctype).toUpperCase(), flags});
    } while(this.isOp(','));
    this.eatOp(')');
    return {type:'create', table, cols};
  }
}

function parseSQL(sql){
  const toks = tokenize(sql);
  const p = new Parser(toks);
  const stmt = p.parseStatement();
  if(p.peek().t !== 'eof') throw new SqlError('Unerwartete Zeichen nach Anweisung: '+p._show());
  return stmt;
}

/* ---------- Evaluator ---------- */
function cloneDb(db){
  const out = {};
  for(const k in db) out[k] = db[k].map(r => Object.assign({}, r));
  return out;
}

function findTable(db, name){
  const key = Object.keys(db).find(k => k.toUpperCase() === String(name).toUpperCase());
  if(!key) throw new SqlError('Unbekannte Tabelle: '+name);
  return {key, rows: db[key]};
}

// env: {tableAliasUpper: rowObjectOrNull, ...}, plus __agg for aggregate context
function resolveCol(env, table, col){
  if(table){
    const key = Object.keys(env).find(k => k.toUpperCase() === table.toUpperCase());
    if(!key) throw new SqlError('Unbekannter Tabellen-Alias: '+table);
    const row = env[key];
    if(row == null) return null;
    const ck = Object.keys(row).find(k => k.toUpperCase() === col.toUpperCase());
    return ck ? row[ck] : null;
  }
  // Suche in allen Tabellen des Envs
  let found, count = 0;
  for(const k in env){
    const row = env[k];
    if(row == null) continue;
    const ck = Object.keys(row).find(x => x.toUpperCase() === col.toUpperCase());
    if(ck){ found = row[ck]; count++; }
  }
  if(count === 0) return null;
  return found;
}

function evalExpr(e, env){
  switch(e.op){
    case 'LIT': return e.v;
    case 'COL': return resolveCol(env, e.table, e.col);
    case 'STAR': return '*';
    case 'NEG': return -evalExpr(e.e, env);
    case 'ARITH': {
      const l = evalExpr(e.l, env), r = evalExpr(e.r, env);
      if(l == null || r == null) return null;
      switch(e.a){ case '+': return l+r; case '-': return l-r; case '*': return l*r; case '/': return r===0?null:l/r; }
      return null;
    }
    case 'AND': { const l = evalExpr(e.l, env); if(l===false) return false; const r = evalExpr(e.r, env); return !!(l && r); }
    case 'OR': { const l = evalExpr(e.l, env); if(l===true) return true; const r = evalExpr(e.r, env); return !!(l || r); }
    case 'NOT': { const v = evalExpr(e.e, env); return v==null ? null : !v; }
    case 'CMP': {
      const l = evalExpr(e.l, env), r = evalExpr(e.r, env);
      if(l == null || r == null) return null;
      const lv = (typeof l === 'string' && typeof r === 'string') ? l : l, rv = r;
      switch(e.cmp){
        case '=': return lv == rv;
        case '!=': return lv != rv;
        case '<': return lv < rv;
        case '>': return lv > rv;
        case '<=': return lv <= rv;
        case '>=': return lv >= rv;
      }
      return null;
    }
    case 'ISNULL': return evalExpr(e.e, env) == null;
    case 'ISNOTNULL': return evalExpr(e.e, env) != null;
    case 'LIKE': {
      const l = evalExpr(e.l, env); const r = evalExpr(e.r, env);
      if(l == null || r == null) return null;
      const pattern = '^'+String(r).replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.')+'$';
      return new RegExp(pattern, 'i').test(String(l));
    }
    case 'IN': {
      const l = evalExpr(e.l, env);
      if(l == null) return null;
      return e.r.some(x => evalExpr(x, env) == l);
    }
    case 'BETWEEN': {
      const v = evalExpr(e.e, env), lo = evalExpr(e.lo, env), hi = evalExpr(e.hi, env);
      if(v==null||lo==null||hi==null) return null;
      return v >= lo && v <= hi;
    }
    case 'FUNC': {
      // Nicht-aggregierte Funktionen (aggregate werden separat behandelt)
      return evalFunc(e, env);
    }
  }
  throw new SqlError('Kann Ausdruck nicht auswerten: '+JSON.stringify(e));
}

const AGG_FUNCS = new Set(['COUNT','SUM','AVG','MIN','MAX']);

function evalFunc(e, env){
  const name = e.name;
  if(name === 'UPPER') return String(evalExpr(e.args[0], env) ?? '').toUpperCase();
  if(name === 'LOWER') return String(evalExpr(e.args[0], env) ?? '').toLowerCase();
  if(name === 'ROUND'){ const v = evalExpr(e.args[0], env); const d = e.args[1]?evalExpr(e.args[1],env):0; return v==null?null:Math.round(v*Math.pow(10,d))/Math.pow(10,d); }
  if(AGG_FUNCS.has(name)) throw new SqlError('Aggregatfunktion '+name+' außerhalb eines gültigen Kontexts');
  throw new SqlError('Unbekannte Funktion: '+name);
}

function evalAgg(e, rows){
  const name = e.name;
  let vals;
  if(e.args.length === 1 && e.args[0].op === 'STAR'){
    vals = rows.map(() => 1);
  } else {
    vals = rows.map(r => evalExpr(e.args[0], r));
    if(e.distinct){ const seen = new Set(); vals = vals.filter(v => { const k=JSON.stringify(v); if(seen.has(k)) return false; seen.add(k); return true; }); }
  }
  const nonNull = vals.filter(v => v != null);
  switch(name){
    case 'COUNT': return e.args.length===1 && e.args[0].op==='STAR' ? rows.length : nonNull.length;
    case 'SUM': return nonNull.length ? nonNull.reduce((a,b)=>a+b,0) : 0;
    case 'AVG': return nonNull.length ? nonNull.reduce((a,b)=>a+b,0)/nonNull.length : null;
    case 'MIN': return nonNull.length ? nonNull.reduce((a,b)=> b<a?b:a) : null;
    case 'MAX': return nonNull.length ? nonNull.reduce((a,b)=> b>a?b:a) : null;
  }
  throw new SqlError('Unbekannte Aggregatfunktion: '+name);
}

function exprHasAgg(e){
  if(!e || typeof e !== 'object') return false;
  if(e.op === 'FUNC' && AGG_FUNCS.has(e.name)) return true;
  for(const k of ['l','r','e','lo','hi']) if(e[k] && exprHasAgg(e[k])) return true;
  if(e.args) for(const a of e.args) if(exprHasAgg(a)) return true;
  return false;
}

function colLabel(item, idx){
  if(item.alias) return item.alias;
  const e = item.expr;
  if(e.op === 'COL') return e.col;
  if(e.op === 'FUNC') return e.name.toLowerCase()+'('+(e.args.length===1&&e.args[0].op==='STAR'?'*':(e.args[0].op==='COL'?e.args[0].col:'…'))+')';
  return 'col'+(idx+1);
}

function makeEnvFromRow(tableKey, row){ const env = {}; env[tableKey] = row; return env; }
function mergeEnv(a, b){ return Object.assign({}, a, b); }

function runSelect(stmt, db){
  const {key: fromKey, rows: fromRows} = findTable(db, stmt.from.name);
  const fromAlias = stmt.from.alias || stmt.from.name;
  let combined = fromRows.map(r => makeEnvFromRow(fromAlias, r));

  for(const j of stmt.joins){
    const {rows: joinRows} = findTable(db, j.table.name);
    const joinAlias = j.table.alias || j.table.name;
    const next = [];
    for(const leftEnv of combined){
      let matched = false;
      for(const r of joinRows){
        const env = mergeEnv(leftEnv, makeEnvFromRow(joinAlias, r));
        let ok;
        try{ ok = evalExpr(j.on, env); } catch(err){ ok = false; }
        if(ok){ matched = true; next.push(env); }
      }
      if(!matched && j.type === 'LEFT'){
        const nullRow = {}; // alle Spaltennamen unbekannt -> resolveCol gibt null zurück, da env[alias]=null
        next.push(mergeEnv(leftEnv, {[joinAlias]: null}));
      }
    }
    combined = next;
  }

  if(stmt.where){
    combined = combined.filter(env => {
      try{ return evalExpr(stmt.where, env) === true; } catch(err){ return false; }
    });
  }

  const hasAgg = stmt.cols.some(c => exprHasAgg(c.expr)) || (stmt.having && exprHasAgg(stmt.having));

  let groups;
  if(stmt.groupBy && stmt.groupBy.length){
    const map = new Map();
    for(const env of combined){
      const keyParts = stmt.groupBy.map(g => resolveCol(env, g.table, g.col));
      const key = JSON.stringify(keyParts);
      if(!map.has(key)) map.set(key, {keyParts, rows:[]});
      map.get(key).rows.push(env);
    }
    groups = [...map.values()];
  } else if(hasAgg){
    groups = [{keyParts:[], rows: combined}];
  } else {
    groups = combined.map(env => ({keyParts:[], rows:[env], single:env}));
  }

  let outRows = groups.map(g => {
    const rep = g.single || g.rows[0] || {};
    return stmt.cols.map(c => {
      if(exprHasAgg(c.expr)){
        if(c.expr.op === 'FUNC' && AGG_FUNCS.has(c.expr.name)) return evalAgg(c.expr, g.rows);
        return evalArithWithAgg(c.expr, g.rows);
      }
      if(c.expr.op === 'STAR'){ return '*ALLCOLS*'; }
      return evalExpr(c.expr, rep);
    });
  });

  // STAR-Expansion (SELECT * oder table.*)
  const expandedCols = [];
  stmt.cols.forEach((c, idx) => {
    if(c.expr.op === 'STAR'){
      if(c.expr.table){
        const {rows} = findTable(db, resolveAliasTableName(stmt, c.expr.table));
        const sampleRow = fromRows[0] || {};
        Object.keys(rowSampleFor(stmt, db, c.expr.table)).forEach(k => expandedCols.push({label:k, src:{star:c.expr.table, col:k}}));
      } else {
        // alle Tabellen (from + joins) in Reihenfolge
        const tables = [stmt.from, ...stmt.joins.map(j=>j.table)];
        tables.forEach(t => {
          const {rows} = findTable(db, t.name);
          const sample = rows[0] || {};
          Object.keys(sample).forEach(k => expandedCols.push({label:k, src:{star:t.alias||t.name, col:k}}));
        });
      }
    } else {
      expandedCols.push({label: colLabel(c, idx), src:{idx}});
    }
  });

  // Falls STAR verwendet wurde, Zeilen neu aus combined (bzw. groups) bauen
  const usesStar = stmt.cols.some(c => c.expr.op === 'STAR');
  if(usesStar){
    outRows = groups.map(g => {
      const rep = g.single || g.rows[0] || {};
      return expandedCols.map(ec => {
        if(ec.src.idx !== undefined){
          const c = stmt.cols[ec.src.idx];
          if(exprHasAgg(c.expr)) return evalAgg(c.expr, g.rows);
          return evalExpr(c.expr, rep);
        }
        return resolveCol(rep, ec.src.star, ec.src.col);
      });
    });
  }

  let columns = expandedCols.map(ec => ec.label);

  // HAVING
  if(stmt.having){
    const keep = [];
    groups.forEach((g, gi) => {
      const rep = g.single || g.rows[0] || {};
      const ok = evalHaving(stmt.having, g.rows, rep);
      if(ok) keep.push(gi);
    });
    outRows = keep.map(i => outRows[i]);
    groups = keep.map(i => groups[i]);
  }

  // ORDER BY
  if(stmt.orderBy){
    const idxOf = (expr) => {
      if(expr.op === 'COL'){
        const i = columns.findIndex(c => c.toUpperCase() === expr.col.toUpperCase());
        if(i >= 0) return i;
      }
      return -1;
    };
    const keyFns = stmt.orderBy.map(ob => {
      const i = idxOf(ob.expr);
      return {i, dir: ob.dir, expr: ob.expr};
    });
    const decorated = outRows.map((row, ri) => ({row, ri, g: groups[ri]}));
    decorated.sort((a,b) => {
      for(const kf of keyFns){
        let av, bv;
        if(kf.i >= 0){ av = a.row[kf.i]; bv = b.row[kf.i]; }
        else {
          const repA = a.g.single || a.g.rows[0] || {};
          const repB = b.g.single || b.g.rows[0] || {};
          av = exprHasAgg(kf.expr) ? evalArithWithAgg(kf.expr, a.g.rows) : evalExpr(kf.expr, repA);
          bv = exprHasAgg(kf.expr) ? evalArithWithAgg(kf.expr, b.g.rows) : evalExpr(kf.expr, repB);
        }
        let cmp;
        if(av == null && bv == null) cmp = 0;
        else if(av == null) cmp = -1;
        else if(bv == null) cmp = 1;
        else if(av < bv) cmp = -1;
        else if(av > bv) cmp = 1;
        else cmp = 0;
        if(kf.dir === 'DESC') cmp = -cmp;
        if(cmp !== 0) return cmp;
      }
      return 0;
    });
    outRows = decorated.map(d => d.row);
  }

  // DISTINCT
  if(stmt.distinct){
    const seen = new Set(); const uniq = [];
    for(const r of outRows){ const k = JSON.stringify(r); if(!seen.has(k)){ seen.add(k); uniq.push(r); } }
    outRows = uniq;
  }

  if(stmt.limit != null) outRows = outRows.slice(0, stmt.limit);

  return {ok:true, type:'select', columns, rows: outRows};
}

function evalArithWithAgg(e, rows){
  if(e.op === 'FUNC' && AGG_FUNCS.has(e.name)) return evalAgg(e, rows);
  if(e.op === 'ARITH'){
    const l = evalArithWithAgg(e.l, rows), r = evalArithWithAgg(e.r, rows);
    if(l==null||r==null) return null;
    switch(e.a){ case '+': return l+r; case '-': return l-r; case '*': return l*r; case '/': return r===0?null:l/r; }
  }
  if(e.op === 'LIT') return e.v;
  return evalExpr(e, rows[0] || {});
}
function evalHaving(e, rows, rep){
  switch(e.op){
    case 'AND': return evalHaving(e.l, rows, rep) && evalHaving(e.r, rows, rep);
    case 'OR': return evalHaving(e.l, rows, rep) || evalHaving(e.r, rows, rep);
    case 'NOT': return !evalHaving(e.e, rows, rep);
    case 'CMP': {
      const l = exprHasAgg(e.l) ? evalArithWithAgg(e.l, rows) : evalExpr(e.l, rep);
      const r = exprHasAgg(e.r) ? evalArithWithAgg(e.r, rows) : evalExpr(e.r, rep);
      if(l==null||r==null) return false;
      switch(e.cmp){ case '=': return l==r; case '!=': return l!=r; case '<': return l<r; case '>': return l>r; case '<=': return l<=r; case '>=': return l>=r; }
      return false;
    }
    default: return !!evalExpr(e, rep);
  }
}
function resolveAliasTableName(stmt, alias){
  const tables = [stmt.from, ...stmt.joins.map(j=>j.table)];
  const t = tables.find(t => (t.alias||t.name).toUpperCase() === alias.toUpperCase());
  return t ? t.name : alias;
}
function rowSampleFor(stmt, db, alias){
  const name = resolveAliasTableName(stmt, alias);
  const {rows} = findTable(db, name);
  return rows[0] || {};
}

function runInsert(stmt, db){
  const {key} = findTable(db, stmt.table);
  const existing = db[key];
  const template = existing[0] || {};
  const allCols = stmt.cols || Object.keys(template);
  let inserted = 0;
  for(const valExprs of stmt.rows){
    if(valExprs.length !== allCols.length) throw new SqlError('Anzahl Werte passt nicht zur Anzahl Spalten');
    const row = {};
    allCols.forEach((c, i) => { row[c] = evalExpr(valExprs[i], {}); });
    existing.push(row);
    inserted++;
  }
  return {ok:true, type:'insert', affected: inserted, db};
}

function runUpdate(stmt, db){
  const {key} = findTable(db, stmt.table);
  const rows = db[key];
  let affected = 0;
  for(const row of rows){
    const env = makeEnvFromRow(key, row);
    let match = true;
    if(stmt.where){ try{ match = evalExpr(stmt.where, env) === true; } catch(e){ match = false; } }
    if(match){
      for(const s of stmt.sets){
        const ck = Object.keys(row).find(k => k.toUpperCase() === s.col.toUpperCase()) || s.col;
        row[ck] = evalExpr(s.val, {});
      }
      affected++;
    }
  }
  return {ok:true, type:'update', affected, db};
}

function runDelete(stmt, db){
  const {key} = findTable(db, stmt.table);
  const rows = db[key];
  const kept = [];
  let affected = 0;
  for(const row of rows){
    const env = makeEnvFromRow(key, row);
    let match = true;
    if(stmt.where){ try{ match = evalExpr(stmt.where, env) === true; } catch(e){ match = false; } }
    if(match) affected++; else kept.push(row);
  }
  db[key] = kept;
  return {ok:true, type:'delete', affected, db};
}

function runCreate(stmt, db){
  const exists = Object.keys(db).some(k => k.toUpperCase() === stmt.table.toUpperCase());
  if(exists) throw new SqlError('Tabelle existiert bereits: '+stmt.table);
  db[stmt.table] = [];
  return {ok:true, type:'create', table: stmt.table, columns: stmt.cols, db};
}

function run(sql, db, opts){
  opts = opts || {};
  const workDb = opts.mutate ? db : cloneDb(db);
  try{
    const stmt = parseSQL(sql);
    let res;
    if(stmt.type === 'select') res = runSelect(stmt, workDb);
    else if(stmt.type === 'insert') res = runInsert(stmt, workDb);
    else if(stmt.type === 'update') res = runUpdate(stmt, workDb);
    else if(stmt.type === 'delete') res = runDelete(stmt, workDb);
    else if(stmt.type === 'create') res = runCreate(stmt, workDb);
    res.stmt = stmt;
    res.dbAfter = workDb;
    return res;
  } catch(err){
    return {ok:false, error: (err && err.message) || String(err)};
  }
}

/* Ergebnisvergleich: Spaltenanzahl + Zeilen (multiset, außer ORDER BY vorgeschrieben) */
function normVal(v){
  if(v == null) return null;
  if(typeof v === 'number') return Math.round(v*1e6)/1e6;
  return String(v);
}
function compareResults(a, b, orderMatters){
  if(!a || !a.ok || !b || !b.ok) return false;
  if(a.type !== b.type) return false;
  if(a.type === 'select'){
    if(a.columns.length !== b.columns.length) return false;
    if(a.rows.length !== b.rows.length) return false;
    const na = a.rows.map(r => r.map(normVal));
    const nb = b.rows.map(r => r.map(normVal));
    if(orderMatters){
      for(let i=0;i<na.length;i++){
        if(JSON.stringify(na[i]) !== JSON.stringify(nb[i])) return false;
      }
      return true;
    }
    const sa = na.map(r=>JSON.stringify(r)).sort();
    const sb = nb.map(r=>JSON.stringify(r)).sort();
    return JSON.stringify(sa) === JSON.stringify(sb);
  }
  return a.affected === b.affected;
}

const SQLEngine = { run, parseSQL, cloneDb, compareResults, SqlError };
if(typeof module !== 'undefined' && module.exports) module.exports = SQLEngine;
else root.SQLEngine = SQLEngine;

/* ============================================================
   SQL-Arena — Engine: Persistenz, State, HUD, Weltkarte, Navigation
   ============================================================ */
const mem = {};
const Store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} mem[k] = v; },
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString('de-AT'); }

/* ---------- State ---------- */
const DEFAULT_STATE = () => ({
  xp: 0, coins: 0, bestStreak: 0,
  progress: {}, // {w1:{quiz:{done,stars,best}, skill:{...}, boss:{...}}}
  examBest: null,
  weak: {}, // {w1:{ok:0,total:0}}
});

let S = Store.get('sqla:state', null) || DEFAULT_STATE();
function saveState(){ Store.set('sqla:state', S); }
function level(){ return Math.floor(S.xp/120) + 1; }
function xpIntoLevel(){ return S.xp % 120; }
function addXp(n){ S.xp += n; saveState(); renderHud(); }
function addCoins(n){ S.coins = Math.max(0, S.coins + n); saveState(); renderHud(); }
function noteStreak(n){ if(n > S.bestStreak){ S.bestStreak = n; saveState(); } }
function noteWeak(worldId, ok){
  if(!S.weak[worldId]) S.weak[worldId] = {ok:0, total:0};
  S.weak[worldId].total++;
  if(ok) S.weak[worldId].ok++;
  saveState();
}
function stageProg(worldId, stage){
  if(!S.progress[worldId]) S.progress[worldId] = {};
  if(!S.progress[worldId][stage]) S.progress[worldId][stage] = {done:false, stars:0, best:0};
  return S.progress[worldId][stage];
}
function completeStage(worldId, stage, stars, scorePct){
  const p = stageProg(worldId, stage);
  p.done = true;
  p.stars = Math.max(p.stars, stars);
  p.best = Math.max(p.best, scorePct);
  saveState();
}
function isStageUnlocked(worldIdx, stageIdx){
  // stageIdx: 0=quiz,1=skill,2=boss innerhalb einer Welt
  if(worldIdx === 0 && stageIdx === 0) return true;
  const worlds = WORLDS;
  if(stageIdx === 0){
    // erste Stage einer Welt: braucht Boss der Vorwelt (oder Welt 0)
    if(worldIdx === 0) return true;
    const prevWorld = worlds[worldIdx-1];
    return !!(S.progress[prevWorld.id] && S.progress[prevWorld.id].boss && S.progress[prevWorld.id].boss.done);
  }
  const stages = ['quiz','skill','boss'];
  const w = worlds[worldIdx];
  const prevStage = stages[stageIdx-1];
  return !!(S.progress[w.id] && S.progress[w.id][prevStage] && S.progress[w.id][prevStage].done);
}
function isExamUnlocked(){
  const last = WORLDS[WORLDS.length-1];
  return !!(S.progress[last.id] && S.progress[last.id].boss && S.progress[last.id].boss.done);
}
function worldStars(worldId){
  const p = S.progress[worldId];
  if(!p) return 0;
  return (p.quiz?.stars||0) + (p.skill?.stars||0) + (p.boss?.stars||0);
}

/* ---------- Navigation / Screen-Root ---------- */
const root = () => document.getElementById('app');
let currentCleanup = null;
function nav(renderFn){
  if(currentCleanup){ try{ currentCleanup(); }catch(e){} currentCleanup = null; }
  const el = root();
  el.innerHTML = '';
  el.scrollTop = 0;
  window.scrollTo({top:0, behavior:'instant'});
  const cleanup = renderFn(el);
  if(typeof cleanup === 'function') currentCleanup = cleanup;
  renderHud();
}

/* ---------- HUD ---------- */
function renderHud(){
  const hud = document.getElementById('hud');
  if(!hud) return;
  const pct = Math.round((xpIntoLevel()/120)*100);
  hud.innerHTML = `
    <button class="hbrand" id="hudHome" aria-label="Zur Weltkarte">🎮 <span>SQL-<b>Arena</b></span></button>
    <div class="hstat" title="Level"><span class="hlv">Lvl ${level()}</span><span class="hxpbar"><i style="width:${pct}%"></i></span></div>
    <div class="hstat hcoin" title="Münzen">🪙 ${S.coins}</div>
  `;
  const homeBtn = document.getElementById('hudHome');
  if(homeBtn) homeBtn.onclick = () => nav(renderMap);
}

/* ---------- Feedback-Helfer ---------- */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind||'');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 1800);
}
function confettiBurst(container){
  const n = 22;
  for(let i=0;i<n;i++){
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.setProperty('--x', (Math.random()*2-1).toFixed(2));
    s.style.setProperty('--r', (Math.random()*360).toFixed(0)+'deg');
    s.style.setProperty('--d', (0.6+Math.random()*0.6).toFixed(2)+'s');
    s.style.background = ['var(--s)','var(--a)','var(--b)','var(--k)','var(--mk)'][i%5];
    container.appendChild(s);
    setTimeout(()=>s.remove(), 1300);
  }
}
function starsHtml(n, max){
  max = max||3;
  let h = '';
  for(let i=1;i<=max;i++) h += `<span class="star ${i<=n?'on':''}">★</span>`;
  return `<span class="stars">${h}</span>`;
}

      html += `<button class="node ${cls}" data-w="${w.id}" data-s="${st.key}" ${unlocked?'':'disabled'}>

        <span class="nlabel">${esc(st.label)}</span>
        ${prog.done ? starsHtml(prog.stars,3) : (unlocked ? '<span class="nhint">'+esc(st.desc)+'</span>' : '<span class="nhint">Gesperrt</span>')}
      </button>`;
    });
    html += `</div></div>`;
  });
  const examUnlocked = isExamUnlocked();
  html += `<div class="worldsec finalesec">
      <div class="wsechead">
        <span class="wicon">🏆</span>
        <div><h2>Finale · Prüfungsarena</h2><p>Gemischter Prüfungssimulator, alle Themen</p></div>

        </button>
      </div>
    </div>`;
  html += `</div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll('.node[data-w]').forEach(btn => {
