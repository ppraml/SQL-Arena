function totalStars(){
  let t = 0;
  WORLDS.forEach(w => t += worldStars(w.id));
  return t;
}

function openStage(worldId, stageKey){
  const world = WORLDS.find(w => w.id === worldId);
  if(!world) return;
  if(stageKey === 'quiz') nav(el => renderStageIntro(el, world, 'quiz'));
  else if(stageKey === 'boss') nav(el => renderStageIntro(el, world, 'boss'));
  else nav(el => renderStageIntro(el, world, 'skill'));
}

function renderStageIntro(el, world, stageKey){
  const sMeta = stageKey==='skill' ? skillMeta(world) : STAGE_META[stageKey];
  const wrap = document.createElement('div');
  wrap.className = 'introwrap';
  wrap.innerHTML = `
    <button class="backlnk" id="back">← Weltkarte</button>
    <div class="introcard g-${world.color}">
      <span class="wicon big">${sMeta.icon}</span>
      <p class="eyebrow">Welt ${world.n} · ${esc(world.title)}</p>
      <h2>${esc(sMeta.label)}</h2>
      <p>${esc(sMeta.desc)}</p>
      <button class="btn primary big" id="startStage">Los geht's</button>
    </div>
  `;
  el.appendChild(wrap);
  wrap.querySelector('#back').onclick = () => nav(renderMap);
  wrap.querySelector('#startStage').onclick = () => {
    if(stageKey === 'quiz') nav(el2 => StageQuiz.render(el2, world, {pool: QUIZ[world.id], count:6, timeLimit:28, lives:3, stageKey:'quiz', xpPer:10, coinPer:2}));
    else if(stageKey === 'boss') nav(el2 => StageQuiz.render(el2, world, {pool: BOSS[world.id], count:6, timeLimit:24, lives:3, stageKey:'boss', xpPer:16, coinPer:3, boss:true}));
    else if(world.skillType === 'sql') nav(el2 => StageSql.render(el2, world, {tasks: world.id==='w5'?SQL_TASKS_W5:SQL_TASKS_W6}));
    else nav(el2 => StageMatch.render(el2, world, {pairs: pick(MATCH[world.id], Math.min(6, MATCH[world.id].length)), timeLimit: 90}));
  };
}

const Engine = {
  Store, shuffle, pick, esc, fmtNum, S, saveState, level, xpIntoLevel, addXp, addCoins, noteStreak, noteWeak,
  stageProg, completeStage, isStageUnlocked, isExamUnlocked, worldStars, totalStars,
  nav, root, renderHud, toast, confettiBurst, starsHtml, openStage,
};
/* ============================================================
   Stage: Quiz-Sprint / Boss — schnelle Multiple-Choice-Runde
   ============================================================ */
const StageQuiz = (() => {
  function render(el, world, cfg){
    const items = shuffle(cfg.pool).slice(0, Math.min(cfg.count, cfg.pool.length)).map(q => {
      const order = shuffle(q.o.map((_,i)=>i));
      return {q: q.q, o: order.map(i=>q.o[i]), c: order.indexOf(q.c), e: q.e};
    });
    let idx = 0, lives = cfg.lives, correct = 0, streak = 0, xpGain = 0, coinGain = 0, timer = null, timeLeft = 0, answered = false;

    const wrap = document.createElement('div');
    wrap.className = 'stagewrap quizwrap g-'+world.color;
    el.appendChild(wrap);

    function clearTimer(){ if(timer){ clearInterval(timer); timer = null; } }

    function paint(){
      const it = items[idx];
      timeLeft = cfg.timeLimit;
      answered = false;
      wrap.innerHTML = `
        <div class="stagehead">
          <button class="backlnk" id="quit">✕</button>
          <div class="qprog"><i style="width:${Math.round(idx/items.length*100)}%"></i></div>
          <div class="lives">${'❤️'.repeat(lives)}${'🖤'.repeat(cfg.lives-lives)}</div>
        </div>
        <div class="streakbadge ${streak>=3?'hot':''}" ${streak<2?'hidden':''}>🔥 ${streak}er-Serie</div>
        <div class="timerbar"><i id="tbar" style="width:100%"></i></div>
        <h3 class="qtext">${esc(it.q)}</h3>
        <div class="opts">
          ${it.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
        </div>
        <p class="qcount">Frage ${idx+1} / ${items.length}</p>
      `;
      wrap.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(parseInt(b.getAttribute('data-i'),10))));
      wrap.querySelector('#quit').onclick = () => confirmQuit();
      startTimer();
    }

    function startTimer(){
      clearTimer();
      const bar = () => wrap.querySelector('#tbar');
      timer = setInterval(() => {
        timeLeft -= 0.1;
        const b = bar();
        if(b) b.style.width = Math.max(0, (timeLeft/cfg.timeLimit*100)) + '%';
        if(timeLeft <= 0){ clearTimer(); answer(-1); }
      }, 100);
    }

    function confirmQuit(){
      clearTimer();
      nav(el2 => renderStageIntro(el2, world, cfg.stageKey));
    }

    function answer(i){
      if(answered) return;
      answered = true;
      clearTimer();
      const it = items[idx];
      const ok = i === it.c;
      const btns = wrap.querySelectorAll('.opt');
      btns.forEach((b,bi) => {
        b.disabled = true;
        if(bi === it.c) b.classList.add('correct');
        else if(bi === i) b.classList.add('wrong');
      });
      if(ok){
        correct++; streak++;
        noteStreak(streak);
        const mult = streak>=6?3:(streak>=3?2:1);
        xpGain += cfg.xpPer * mult;
        coinGain += cfg.coinPer;
        toast('+'+(cfg.xpPer*mult)+' XP'+(mult>1?' (×'+mult+' Serie!)':''), 'ok');
      } else {
        lives--; streak = 0;
      }
      noteWeak(world.id, ok);
      const expl = document.createElement('div');
      expl.className = 'expl ' + (ok?'ok':'no');
      expl.innerHTML = `<b>${ok?'Richtig!':(i===-1?'Zeit abgelaufen.':'Nicht ganz.')}</b> ${esc(it.e||'')}
        <div class="nextrow"><button class="btn primary" id="nextBtn">Weiter →</button></div>`;
      wrap.appendChild(expl);
      const advance = () => {
        if(lives <= 0){ finish(false); return; }
        idx++;
        if(idx >= items.length){ finish(true); return; }
        paint();
      };
      const nb = wrap.querySelector('#nextBtn');
      nb.focus();
      nb.onclick = advance;
      wrap.addEventListener('keydown', function onKey(e){
        if(e.key==='Enter'){ wrap.removeEventListener('keydown', onKey); advance(); }
      });
    }

    function finish(passed){
      clearTimer();
      const pct = Math.round(correct/items.length*100);
      let stars = 0;
      if(passed){
        stars = pct>=100 ? 3 : (pct>=70 ? 2 : 1);
        xpGain += 15;
        completeStage(world.id, cfg.stageKey, stars, pct);
      }
      wrap.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'resultcard ' + (passed?'win':'lose');
      card.innerHTML = passed ? `
        <div class="confwrap"></div>
        <span class="ricon">${cfg.boss?'👑':'🎉'}</span>
        <h2>${cfg.boss?'Boss besiegt!':'Runde geschafft!'}</h2>
        <p>${correct} von ${items.length} richtig · ${pct}%</p>
        ${starsHtml(stars,3)}
        <p class="rewards">+${xpGain} XP · +${coinGain} 🪙</p>
        <div class="rbtns">
          <button class="btn" id="again">Nochmal</button>
          <button class="btn primary" id="toMap">Weiter zur Karte</button>
        </div>
      ` : `
        <span class="ricon">💔</span>
        <h2>Leben aufgebraucht</h2>
        <p>${correct} von ${idx+1} richtig geschafft — versuch's gleich nochmal!</p>
        <div class="rbtns">
          <button class="btn primary" id="again">Nochmal versuchen</button>
          <button class="btn" id="toMap">Zur Karte</button>
        </div>
      `;
      wrap.appendChild(card);
      if(passed){ addXp(xpGain); addCoins(coinGain); confettiBurst(card.querySelector('.confwrap')); }
      card.querySelector('#again').onclick = () => nav(el2 => render(el2, world, cfg));
      card.querySelector('#toMap').onclick = () => nav(renderMap);
    }

    paint();
    return () => clearTimer();
  }
  return {render};
})();
/* ============================================================
   Stage: Match-Duell — Begriffe/Szenarien gegen Zuordnung, gegen die Zeit
   ============================================================ */
const StageMatch = (() => {
  function render(el, world, cfg){
    const pairs = cfg.pairs.map((p,i) => ({...p, id:i}));
    const leftItems = shuffle(pairs.map(p => ({id:p.id, txt:p.a})));
    const rightItems = shuffle(pairs.map(p => ({id:p.id, txt:p.b})));
    let matched = new Set(), mistakes = 0, streak = 0, selL = null, selR = null, timeLeft = cfg.timeLimit, timer = null, xpGain = 0, coinGain = 0, ended = false;

    const wrap = document.createElement('div');
    wrap.className = 'stagewrap matchwrap g-'+world.color;
    el.appendChild(wrap);

    function paint(){
      wrap.innerHTML = `
        <div class="stagehead">
          <button class="backlnk" id="quit">✕</button>
          <div class="qprog"><i style="width:${Math.round(matched.size/pairs.length*100)}%"></i></div>
          <div class="mtime" id="mtime">⏱ ${Math.ceil(timeLeft)}s</div>
        </div>
        <div class="streakbadge ${streak>=3?'hot':''}" ${streak<2?'hidden':''}>🔥 ${streak}er-Serie</div>
        <p class="qcount">${matched.size} / ${pairs.length} zugeordnet ${mistakes?(' · '+mistakes+' Fehlversuche'):''}</p>
        <div class="matchgrid">
          <div class="mcol" id="colL">${leftItems.map(it => matchBtn(it,'l')).join('')}</div>
          <div class="mcol" id="colR">${rightItems.map(it => matchBtn(it,'r')).join('')}</div>
        </div>
      `;
      wrap.querySelector('#quit').onclick = () => { clearTimer(); nav(el2 => renderStageIntro(el2, world, 'skill')); };
      wrap.querySelectorAll('.mitem').forEach(b => b.addEventListener('click', onPick));
    }
    function matchBtn(it, side){
      const done = matched.has(it.id);
      const sel = (side==='l' && selL===it.id) || (side==='r' && selR===it.id);
      return `<button class="mitem ${done?'done':''} ${sel?'sel':''}" data-side="${side}" data-id="${it.id}" ${done?'disabled':''}>${esc(it.txt)}</button>`;
    }

    function onPick(e){
      if(ended) return;
      const side = e.currentTarget.getAttribute('data-side');
      const id = parseInt(e.currentTarget.getAttribute('data-id'),10);
      if(matched.has(id)) return;
      if(side==='l') selL = (selL===id) ? null : id; else selR = (selR===id) ? null : id;
      paint();
      if(selL!=null && selR!=null){
        if(selL === selR){
          matched.add(selL);
          streak++; noteStreak(streak);
          const mult = streak>=6?3:(streak>=3?2:1);
          xpGain += 12*mult; coinGain += 2;
          toast('Match! +'+(12*mult)+' XP', 'ok');
          selL = null; selR = null;
          paint();
          if(matched.size === pairs.length) finish(true);
        } else {
          mistakes++; streak = 0;
          const l = wrap.querySelector(`.mitem[data-side="l"][data-id="${selL}"]`);
          const r = wrap.querySelector(`.mitem[data-side="r"][data-id="${selR}"]`);
          if(l) l.classList.add('shake'); if(r) r.classList.add('shake');
          timeLeft = Math.max(1, timeLeft - 2);
          setTimeout(() => { selL=null; selR=null; paint(); }, 420);
        }
      }
    }

    function clearTimer(){ if(timer){ clearInterval(timer); timer=null; } }
    function startTimer(){
      timer = setInterval(() => {
        timeLeft -= 0.2;
        const t = wrap.querySelector('#mtime');
        if(t) t.textContent = '⏱ ' + Math.max(0,Math.ceil(timeLeft)) + 's';
        if(timeLeft <= 0){ clearTimer(); finish(matched.size===pairs.length); }
      }, 200);
    }

    function finish(passed){
      ended = true;
      clearTimer();
      let stars = 0;
      if(passed){
        stars = mistakes===0 ? 3 : (mistakes<=2 ? 2 : 1);
        xpGain += 15;
        completeStage(world.id, 'skill', stars, Math.round(matched.size/pairs.length*100));
      }
      wrap.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'resultcard ' + (passed?'win':'lose');
      card.innerHTML = passed ? `
        <div class="confwrap"></div>
        <span class="ricon">🧩</span>
        <h2>Alle zugeordnet!</h2>
        <p>${mistakes} Fehlversuche</p>
        ${starsHtml(stars,3)}
        <p class="rewards">+${xpGain} XP · +${coinGain} 🪙</p>
        <div class="rbtns">
          <button class="btn" id="again">Nochmal</button>
          <button class="btn primary" id="toMap">Weiter zur Karte</button>
        </div>
      ` : `
        <span class="ricon">⏱️</span>
        <h2>Zeit abgelaufen</h2>
        <p>${matched.size} von ${pairs.length} geschafft — nochmal versuchen?</p>
        <div class="rbtns">
          <button class="btn primary" id="again">Nochmal versuchen</button>
          <button class="btn" id="toMap">Zur Karte</button>
        </div>
      `;
      wrap.appendChild(card);
      if(passed){ addXp(xpGain); addCoins(coinGain); confettiBurst(card.querySelector('.confwrap')); }
      card.querySelector('#again').onclick = () => nav(el2 => render(el2, world, {pairs: pick(MATCH[world.id], Math.min(6, MATCH[world.id].length)), timeLimit: cfg.timeLimit}));
      card.querySelector('#toMap').onclick = () => nav(renderMap);
    }

    paint();
    startTimer();
    return () => clearTimer();
  }
  return {render};
})();
/* ============================================================
   Stage: SQL-Werkstatt — echte SQL-Abfragen live ausführen & prüfen
   Kein Leben-Verlust: hier darf man in Ruhe ausprobieren. Hilfe kostet
   nur Münzen, nie den Fortschritt.
   ============================================================ */
const StageSql = (() => {
  function render(el, world, cfg){
    const tasks = cfg.tasks;
    let idx = 0, hintIdx = {}, xpGain = 0, coinGain = 0, hintsUsed = 0, wrongSubs = 0, solutionsShown = {}, attempts = {}, ended = false;

    const wrap = document.createElement('div');
    wrap.className = 'stagewrap sqlwrap g-'+world.color;
    el.appendChild(wrap);

    function schemaHtml(){
      return Object.keys(SEED_DB).map(t => {
        const rows = SEED_DB[t].slice(0,3);
        const cols = Object.keys(SEED_DB[t][0]||{});
        return `<div class="schemat">
          <h5>${t} <span>(${SEED_DB[t].length} Zeilen)</span></h5>
          <div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]===null?'<i>NULL</i>':esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        </div>`;
      }).join('');
    }
    function cheatsheetHtml(){
      return SQL_CHEATSHEET.map(c => `<div class="cheatcard"><h6>${esc(c.t)}</h6><pre>${esc(c.c)}</pre></div>`).join('');
    }

    function paint(){
      const t = tasks[idx];
      hintIdx[t.id] = hintIdx[t.id] || 0;
      attempts[t.id] = attempts[t.id] || 0;
      const hi = hintIdx[t.id];
      const hintsLeft = t.hints.length - hi;
      const nextHintFree = hi === 0;
      wrap.innerHTML = `
        <div class="stagehead">
          <button class="backlnk" id="quit">✕</button>
          <div class="qprog"><i style="width:${Math.round(idx/tasks.length*100)}%"></i></div>
          <div class="attemptct">Aufgabe ${idx+1}/${tasks.length}</div>
        </div>
        ${idx===0 ? `<p class="sqlintro">💛 Kein Herz-Verlust hier — probiere so oft du willst mit <b>▶ Ausführen</b>. Fest hängen? Der <b>Spickzettel</b> und <b>Tipps</b> helfen weiter.</p>` : ''}
        <p class="qcount">${'⭐'.repeat(t.diff)} Schwierigkeit</p>
        <div class="sqltask">${t.prompt}</div>
        <div class="refrow">
          <details class="schemabox"><summary>📋 Tabellen anzeigen</summary><div class="schemas">${schemaHtml()}</div></details>
          <details class="schemabox cheatbox"><summary>📎 SQL-Spickzettel</summary><div class="cheats">${cheatsheetHtml()}</div></details>
        </div>
        <textarea id="sqlin" class="sqlin" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="SELECT ...">${Engine_lastDraft[t.id]||''}</textarea>
        <div class="sqlbtns">
          <button class="btn" id="runBtn">▶ Ausführen</button>
          <button class="btn hintbtn" id="hintBtn" ${hintsLeft<=0?'disabled':''}>💡 Tipp ${hintsLeft<=0?'(alle gezeigt)':(nextHintFree?'(gratis)':'(−4 🪙)')}</button>
          <button class="btn solbtn" id="solBtn">🔓 Lösung zeigen (−8 🪙)</button>
          <button class="btn primary" id="subBtn">✓ Antwort abgeben</button>
        </div>
        <div id="sqlout" class="sqlout"></div>
        <div id="hintout" class="hintout"></div>
      `;
      wrap.querySelector('#quit').onclick = () => nav(el2 => renderStageIntro(el2, world, 'skill'));
      const ta = wrap.querySelector('#sqlin');
      ta.addEventListener('input', () => { Engine_lastDraft[t.id] = ta.value; });
      ta.addEventListener('keydown', (e) => { if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); runQuery(); } });
      wrap.querySelector('#runBtn').onclick = runQuery;
      wrap.querySelector('#subBtn').onclick = submit;
      wrap.querySelector('#hintBtn').onclick = showHint;
      wrap.querySelector('#solBtn').onclick = showSolution;
    }

    function runQuery(){
      const t = tasks[idx];
      const ta = wrap.querySelector('#sqlin');
      const out = wrap.querySelector('#sqlout');
      const sql = ta.value.trim();
      if(!sql){ out.innerHTML = '<p class="sqlmsg warn">Schreib zuerst eine SQL-Abfrage.</p>'; return; }
      const db = SQLEngine.cloneDb(SEED_DB);
      const r = SQLEngine.run(sql, db, {mutate:true});
      if(!r.ok){
        out.innerHTML = `<p class="sqlmsg err">⚠️ Fehler: ${esc(r.error)}</p>`;
        return;
      }
      if(r.type === 'select'){
        out.innerHTML = renderTable(r.columns, r.rows);
      } else {
        out.innerHTML = `<p class="sqlmsg ok">✓ Ausgeführt — ${r.affected} Zeile(n) betroffen.</p>` + renderTable(Object.keys(db[t.table][0]||{}), db[t.table].slice(0,8).map(row=>Object.values(row)));
      }
    }

    function renderTable(cols, rows){
      if(!cols.length) return '<p class="sqlmsg">Kein Ergebnis.</p>';
      const shown = rows.slice(0, 30);
      return `<div class="tblwrap"><table class="restbl"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${shown.length ? shown.map(r=>`<tr>${r.map(v=>`<td>${v===null||v===undefined?'<i>NULL</i>':esc(v)}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}"><i>0 Zeilen</i></td></tr>`}</tbody>
      </table></div><p class="rowcount">${rows.length} Zeile(n)${rows.length>30?' (erste 30 gezeigt)':''}</p>`;
    }

    function showHint(){
      const t = tasks[idx];
      const hi = hintIdx[t.id] || 0;
      if(hi >= t.hints.length) return;
      const free = hi === 0;
      if(!free){
        if(S.coins < 4){ toast('Nicht genug Münzen für einen weiteren Tipp.', 'no'); return; }
        addCoins(-4);
      }
      hintsUsed++;
      hintIdx[t.id] = hi+1;
      const hout = wrap.querySelector('#hintout');
      hout.innerHTML += `<p class="hintline">💡 ${esc(t.hints[hi])}</p>`;
      paint_refreshBtns();
    }

    function showSolution(){
      const t = tasks[idx];
      if(S.coins < 8){ toast('Nicht genug Münzen für die Lösung.', 'no'); return; }
      addCoins(-8);
      solutionsShown[t.id] = true;
      const ta = wrap.querySelector('#sqlin');
      ta.value = t.sol;
      Engine_lastDraft[t.id] = t.sol;
      const hout = wrap.querySelector('#hintout');
      hout.innerHTML += `<p class="hintline solreveal">🔓 Lösung eingefügt — schau sie dir an, dann klick <b>▶ Ausführen</b> und <b>✓ Antwort abgeben</b>, damit sie wirklich hängen bleibt.</p>`;
    }

    function paint_refreshBtns(){
      // Tipp-Button neu bewerten, ohne die ganze Aufgabe neu zu zeichnen (Texteingabe bleibt erhalten)
      const t = tasks[idx];
      const hi = hintIdx[t.id] || 0;
      const hintsLeft = t.hints.length - hi;
      const nextHintFree = hi === 0;
      const btn = wrap.querySelector('#hintBtn');
      if(btn){
        btn.disabled = hintsLeft<=0;
        btn.textContent = '💡 Tipp ' + (hintsLeft<=0?'(alle gezeigt)':(nextHintFree?'(gratis)':'(−4 🪙)'));
      }
    }

    function submit(){
      const t = tasks[idx];
      const ta = wrap.querySelector('#sqlin');
      const out = wrap.querySelector('#sqlout');
      const sql = ta.value.trim();
      if(!sql){ out.innerHTML = '<p class="sqlmsg warn">Schreib zuerst eine SQL-Abfrage.</p>'; return; }
      attempts[t.id] = (attempts[t.id]||0) + 1;
      const userDb = SQLEngine.cloneDb(SEED_DB);
      const userRes = SQLEngine.run(sql, userDb, {mutate:true});
      if(!userRes.ok){
        out.innerHTML = `<p class="sqlmsg err">⚠️ Fehler: ${esc(userRes.error)}</p>`;
        onWrong();
        return;
      }
      const solDb = SQLEngine.cloneDb(SEED_DB);
      const solRes = SQLEngine.run(t.sol, solDb, {mutate:true});
      let ok;
      if(t.type === 'select'){
        out.innerHTML = renderTable(userRes.columns, userRes.rows);
        ok = SQLEngine.compareResults(userRes, solRes, !!t.orderMatters);
      } else {
        out.innerHTML = `<p class="sqlmsg">${userRes.affected} Zeile(n) betroffen.</p>` + renderTable(Object.keys(userDb[t.table][0]||userDb[t.table]||{}), (userDb[t.table]||[]).slice(0,8).map(r=>Object.values(r)));
        ok = compareTableRows(userDb[t.table], solDb[t.table]);
      }
      noteWeak(world.id, ok);
      if(ok) onCorrect(); else onWrong();
    }

    function compareTableRows(a, b){
      if(!a || !b || a.length !== b.length) return false;
      const norm = rows => rows.map(r => JSON.stringify(Object.keys(r).sort().map(k=>[k, typeof r[k]==='number'?Math.round(r[k]*1e6)/1e6:r[k]]))).sort();
      return JSON.stringify(norm(a)) === JSON.stringify(norm(b));
    }

    function onCorrect(){
      const t = tasks[idx];
      const cleanSolve = !solutionsShown[t.id] && (hintIdx[t.id]||0)===0 && (attempts[t.id]||1)<=1;
      xpGain += cleanSolve ? 18 : 12;
      coinGain += 3;
      toast('Richtig! +'+(cleanSolve?18:12)+' XP', 'ok');
      const msg = document.createElement('div');
      msg.className = 'expl ok';
      msg.innerHTML = '<b>Passt!</b> So sieht eine Musterlösung aus: <code>'+esc(t.sol)+'</code>'
        + `<div class="nextrow"><button class="btn primary" id="nextBtn">${idx+1>=tasks.length?'Werkstatt abschließen':'Nächste Aufgabe →'}</button></div>`;
      wrap.appendChild(msg);
      wrap.querySelectorAll('.sqlbtns button').forEach(b => b.disabled = true);
      const nb = msg.querySelector('#nextBtn');
      nb.focus();
      nb.onclick = () => {
        idx++;
        if(idx >= tasks.length){ finish(true); return; }
        paint();
      };
    }
    function onWrong(){
      wrongSubs++;
      toast('Noch nicht ganz — schau dir die Fehlermeldung/Ausgabe an und versuch\'s einfach nochmal. Kostet nichts!', 'no');
      const t = tasks[idx];
      if((attempts[t.id]||0) >= 2){
        const hout = wrap.querySelector('#hintout');
        if(hout && !hout.querySelector('.nudge')){
          hout.innerHTML += `<p class="hintline nudge">🤔 Zwei Versuche schon — vielleicht hilft ein 💡 Tipp oder ein Blick in den 📎 Spickzettel?</p>`;
        }
      }
    }

    function finish(passed){
      ended = true;
      const trouble = hintsUsed + wrongSubs + Object.keys(solutionsShown).length*3;
      const stars = trouble===0 ? 3 : (trouble<=4 ? 2 : 1);
      xpGain += 20;
      completeStage(world.id, 'skill', stars, 100);
      wrap.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'resultcard win';
      card.innerHTML = `
        <div class="confwrap"></div>
        <span class="ricon">⌨️</span>
        <h2>SQL-Werkstatt geschafft!</h2>
        <p>${tasks.length} Aufgaben gelöst · ${hintsUsed} Tipps · ${wrongSubs} Fehlversuche</p>
        ${starsHtml(stars,3)}
        <p class="rewards">+${xpGain} XP · +${coinGain} 🪙</p>
        <div class="rbtns">
          <button class="btn" id="again">Nochmal</button>
          <button class="btn primary" id="toMap">Weiter zur Karte</button>
        </div>
      `;
      wrap.appendChild(card);
      addXp(xpGain); addCoins(coinGain); confettiBurst(card.querySelector('.confwrap'));
      card.querySelector('#again').onclick = () => nav(el2 => render(el2, world, cfg));
      card.querySelector('#toMap').onclick = () => nav(renderMap);
    }

    paint();
    return () => {};
  }
  return {render};
})();
const Engine_lastDraft = {};
/* ============================================================
   Finale: Prüfungsarena — gemischter, zeitbasierter Prüfungssimulator
   ============================================================ */
function renderExamIntro(el){
  const wrap = document.createElement('div');
  wrap.className = 'introwrap';
  wrap.innerHTML = `
    <button class="backlnk" id="back">← Weltkarte</button>
    <div class="introcard g-warn">
      <span class="wicon big">🏆</span>
      <p class="eyebrow">Finale</p>
      <h2>Prüfungsarena</h2>
      <p>Gemischte Fragen aus allen 7 Welten, plus echte SQL-Aufgaben. Kein Herz-Limit — wie bei der echten Prüfung beantwortest du einfach alles, was kommt, und siehst am Ende deine Schwachstellen.</p>
      <div class="examchoices">
        <button class="btn primary big" id="short">Kurzcheck — 15 Fragen</button>
        <button class="btn big" id="full">Volltest — 25 Fragen</button>
      </div>
    </div>
  `;
  el.appendChild(wrap);
  wrap.querySelector('#back').onclick = () => nav(renderMap);
  wrap.querySelector('#short').onclick = () => nav(el2 => StageExam.render(el2, 15));
  wrap.querySelector('#full').onclick = () => nav(el2 => StageExam.render(el2, 25));
}

const StageExam = (() => {
  function buildPool(n){
    const quizItems = [];
    WORLDS.forEach(w => {
      QUIZ[w.id].forEach(q => quizItems.push({type:'quiz', w:w.id, q}));
      BOSS[w.id].forEach(q => quizItems.push({type:'quiz', w:w.id, q}));
    });
    const sqlItems = [];
    SQL_TASKS_W5.forEach(t => sqlItems.push({type:'sql', w:'w5', task:t}));
    SQL_TASKS_W6.forEach(t => sqlItems.push({type:'sql', w:'w6', task:t}));
    const sqlCount = n >= 25 ? 4 : 2;
    const chosenSql = pick(sqlItems, sqlCount);
    const chosenQuiz = pick(quizItems, n - chosenSql.length);
    return shuffle([...chosenQuiz, ...chosenSql]);
  }

  function render(el, n){
    const items = buildPool(n);
    let idx = 0, correct = 0, xpGain = 0, byWorld = {};
    WORLDS.forEach(w => byWorld[w.id] = {ok:0, total:0});

    const wrap = document.createElement('div');
    wrap.className = 'stagewrap examwrap g-warn';
    el.appendChild(wrap);
    let timer = null, timeLeft = 0;

    function clearTimer(){ if(timer){ clearInterval(timer); timer=null; } }

    function paint(){
      const it = items[idx];
      wrap.innerHTML = `
        <div class="stagehead">
          <button class="backlnk" id="quit">✕</button>
          <div class="qprog"><i style="width:${Math.round(idx/items.length*100)}%"></i></div>
          <div class="examn">Frage ${idx+1}/${items.length}</div>
        </div>
      `;
      wrap.querySelector('#quit').onclick = () => { clearTimer(); nav(renderMap); };
      if(it.type === 'quiz') paintQuiz(it);
      else paintSql(it);
    }

    function paintQuiz(it){
      const q = it.q;
      const order = shuffle(q.o.map((_,i)=>i));
      const opts = order.map(i=>q.o[i]);
      const cIdx = order.indexOf(q.c);
      timeLeft = 32;
      const body = document.createElement('div');
      body.innerHTML = `
        <div class="timerbar"><i id="tbar" style="width:100%"></i></div>
        <h3 class="qtext">${esc(q.q)}</h3>
        <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      `;
      wrap.appendChild(body);
      let answered = false;
      body.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        if(answered) return; answered = true; clearTimer();
        const i = parseInt(b.getAttribute('data-i'),10);
        const ok = i === cIdx;
        body.querySelectorAll('.opt').forEach((bb,bi) => { bb.disabled = true; if(bi===cIdx) bb.classList.add('correct'); else if(bi===i) bb.classList.add('wrong'); });
        registerAnswer(it.w, ok, q.e);
      }));
      timer = setInterval(() => {
        timeLeft -= 0.1;
        const b = body.querySelector('#tbar');
        if(b) b.style.width = Math.max(0, timeLeft/32*100)+'%';
        if(timeLeft<=0 && !answered){ answered = true; clearTimer();
          body.querySelectorAll('.opt').forEach((bb,bi) => { bb.disabled = true; if(bi===cIdx) bb.classList.add('correct'); });
          registerAnswer(it.w, false, q.e);
        }
      }, 100);
    }

    function paintSql(it){
      const t = it.task;
      const body = document.createElement('div');
      body.innerHTML = `
        <p class="qcount">SQL-Aufgabe</p>
        <div class="sqltask">${t.prompt}</div>
        <details class="schemabox"><summary>📋 Tabellen anzeigen</summary><div class="schemas">${schemaHtmlMini()}</div></details>
        <textarea id="sqlin" class="sqlin" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="SELECT ..."></textarea>
        <div class="sqlbtns">
          <button class="btn" id="runBtn">▶ Ausführen</button>
          <button class="btn primary" id="subBtn">✓ Antwort abgeben</button>
          <button class="btn" id="skipBtn">Überspringen</button>
        </div>
        <div id="sqlout" class="sqlout"></div>
      `;
      wrap.appendChild(body);
      body.querySelector('#runBtn').onclick = () => {
        const sql = body.querySelector('#sqlin').value.trim();
        const db = SQLEngine.cloneDb(SEED_DB);
        const r = SQLEngine.run(sql, db, {mutate:true});
        const out = body.querySelector('#sqlout');
        if(!r.ok){ out.innerHTML = `<p class="sqlmsg err">⚠️ ${esc(r.error)}</p>`; return; }
        if(r.type==='select') out.innerHTML = tableHtml(r.columns, r.rows);
        else out.innerHTML = `<p class="sqlmsg ok">✓ ${r.affected} Zeile(n) betroffen.</p>`;
      };
      body.querySelector('#subBtn').onclick = () => {
        const sql = body.querySelector('#sqlin').value.trim();
        const userDb = SQLEngine.cloneDb(SEED_DB);
        const ur = SQLEngine.run(sql, userDb, {mutate:true});
        let ok = false;
        if(ur.ok){
          const solDb = SQLEngine.cloneDb(SEED_DB);
          const sr = SQLEngine.run(t.sol, solDb, {mutate:true});
          if(t.type==='select') ok = SQLEngine.compareResults(ur, sr, !!t.orderMatters);
          else ok = JSON.stringify((userDb[t.table]||[]).map(r=>JSON.stringify(Object.entries(r).sort())).sort()) === JSON.stringify((solDb[t.table]||[]).map(r=>JSON.stringify(Object.entries(r).sort())).sort());
        }
        registerAnswer(it.w, ok, 'Musterlösung: '+t.sol);
      };
      body.querySelector('#skipBtn').onclick = () => registerAnswer(it.w, false, 'Übersprungen. Musterlösung: '+t.sol);
    }

    function schemaHtmlMini(){
      return Object.keys(SEED_DB).map(t => {
        const rows = SEED_DB[t].slice(0,2);
        const cols = Object.keys(SEED_DB[t][0]||{});
        return `<div class="schemat"><h5>${t}</h5><div class="tblwrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]===null?'<i>NULL</i>':esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
      }).join('');
    }
    function tableHtml(cols, rows){
      const shown = rows.slice(0,20);
      return `<div class="tblwrap"><table class="restbl"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${shown.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<i>NULL</i>':esc(v)}</td>`).join('')}</tr>`).join('')||'<tr><td>0 Zeilen</td></tr>'}</tbody></table></div>`;
    }

    function registerAnswer(worldId, ok, expl){
      clearTimer();
      byWorld[worldId].total++;
      if(ok){ byWorld[worldId].ok++; correct++; xpGain += 12; }
      noteWeak(worldId, ok);
      const msg = document.createElement('div');
      msg.className = 'expl ' + (ok?'ok':'no');
      msg.innerHTML = `<b>${ok?'Richtig!':'Nicht ganz.'}</b> ${esc(String(expl||''))}
        <div class="nextrow"><button class="btn primary" id="nextBtn">${idx+1>=items.length?'Ergebnis anzeigen':'Weiter →'}</button></div>`;
      wrap.appendChild(msg);
      const advance = () => {
        idx++;
        wrap.innerHTML = '';
        if(idx >= items.length){ finish(); return; }
        paint();
      };
      const nb = wrap.querySelector('#nextBtn');
      nb.focus();
      nb.onclick = advance;
    }

    function finish(){
      const pct = Math.round(correct/items.length*100);
      if(S.examBest===null || pct > S.examBest){ S.examBest = pct; saveState(); }
      addXp(xpGain);
      wrap.innerHTML = '';
      const weakWorlds = WORLDS.filter(w => byWorld[w.id].total>0 && (byWorld[w.id].ok/byWorld[w.id].total) < 0.7);
      const card = document.createElement('div');
      card.className = 'resultcard exam ' + (pct>=70?'win':'lose');
      card.innerHTML = `
        <div class="confwrap"></div>
        <span class="ricon">${pct>=70?'🏆':'📚'}</span>
        <h2>${pct}% erreicht</h2>
        <p>${correct} von ${items.length} richtig · +${xpGain} XP</p>
        <div class="worldbars">
          ${WORLDS.map(w => {
            const d = byWorld[w.id];
            const p = d.total ? Math.round(d.ok/d.total*100) : null;
            return `<div class="wbar"><span class="wblabel">${w.icon} ${esc(w.title)}</span><div class="wbtrack"><i style="width:${p===null?0:p}%" class="${p!==null&&p<70?'low':''}"></i></div><span class="wbpct">${p===null?'–':p+'%'}</span></div>`;
          }).join('')}
        </div>
        ${weakWorlds.length ? `<p class="weaktip">🎯 Noch üben: ${weakWorlds.map(w=>esc(w.title)).join(', ')}</p>` : `<p class="weaktip ok">Stark in allen Themen — weiter so!</p>`}
        <div class="rbtns">
          <button class="btn" id="again">Neuer Versuch</button>
          <button class="btn primary" id="toMap">Zur Karte</button>
        </div>
      `;
      wrap.appendChild(card);
      if(pct>=70) confettiBurst(card.querySelector('.confwrap'));
      card.querySelector('#again').onclick = () => nav(renderExamIntro);
      card.querySelector('#toMap').onclick = () => nav(renderMap);
    }

    paint();
    return () => clearTimer();
  }
  return {render};
})();
